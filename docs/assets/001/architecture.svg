<svg viewBox="0 0 1080 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowViolet" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowEmerald" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#34d399"/>
    </marker>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <rect width="1080" height="720" fill="#0B1120"/>
  <rect width="1080" height="720" fill="url(#grid)"/>
  
  <!-- Flèche 1: QUESTION vers CERVEAU -->
  <path d="M 540,130 L 540,240" stroke="#fbbf24" stroke-width="3" fill="none" marker-end="url(#arrowAmber)"/>
  
  <!-- Flèche 2: MÉMOIRE vers CERVEAU -->
  <path d="M 280,350 L 380,350" stroke="#a78bfa" stroke-width="3" fill="none" marker-end="url(#arrowViolet)"/>
  <text x="330" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#a78bfa" text-anchor="middle">il lit l'historique</text>
  
  <!-- Flèche 3: CERVEAU vers OUTIL -->
  <path d="M 700,350 L 780,350" stroke="#34d399" stroke-width="3" fill="none" marker-end="url(#arrowEmerald)"/>
  <text x="740" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#34d399" text-anchor="middle" font-weight="bold">OUI</text>
  <text x="740" y="370" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#34d399" text-anchor="middle">il manque une info</text>
  
  <!-- Flèche 4: OUTIL vers MÉMOIRE (en L, sous le cerveau) -->
  <path d="M 890,420 L 890,480 L 280,480" stroke="#34d399" stroke-width="3" fill="none" stroke-dasharray="6,4" marker-end="url(#arrowEmerald)"/>
  <text x="585" y="495" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#34d399" text-anchor="middle">le résultat revient en mémoire</text>
  
  <!-- Flèche 5: CERVEAU vers RÉPONSE -->
  <path d="M 540,420 L 680,500" stroke="#fbbf24" stroke-width="3" fill="none" marker-end="url(#arrowAmber)"/>
  <text x="600" y="450" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fbbf24" text-anchor="middle" font-weight="bold">NON</text>
  <text x="600" y="465" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">j'ai tout</text>
  
  <!-- QUESTION -->
  <rect x="380" y="70" width="320" height="60" rx="10" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/>
  <text x="540" y="95" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#fbbf24" text-anchor="middle" font-weight="bold">QUESTION</text>
  <text x="540" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fbbf24" text-anchor="middle">« Quelle heure est-il à Tokyo ? »</text>
  
  <!-- CERVEAU -->
  <rect x="380" y="240" width="320" height="180" rx="10" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-width="2" filter="url(#shadow)"/>
  <text x="540" y="270" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#22d3ee" text-anchor="middle" font-weight="bold">🧠 CERVEAU</text>
  <text x="540" y="295" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#22d3ee" text-anchor="middle">(Agent IA)</text>
  <text x="540" y="330" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">Point de décision :</text>
  <text x="540" y="350" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#22d3ee" text-anchor="middle" font-weight="bold">« Il me manque une info ? »</text>
  <text x="540" y="380" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Je réfléchis et je décide</text>
  <text x="540" y="400" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">si j'ai besoin d'un outil</text>
  
  <!-- MÉMOIRE -->
  <rect x="80" y="180" width="200" height="380" rx="10" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="210" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#a78bfa" text-anchor="middle" font-weight="bold">💾 MÉMOIRE</text>
  <text x="180" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#a78bfa" text-anchor="middle">(Historique)</text>
  <text x="180" y="270" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Tout ce qui s'est passé :</text>
  <text x="180" y="295" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• La question posée</text>
  <text x="180" y="315" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Les décisions prises</text>
  <text x="180" y="335" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Les outils utilisés</text>
  <text x="180" y="355" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Les résultats obtenus</text>
  <text x="180" y="390" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#a78bfa" text-anchor="middle" font-weight="bold">L'agent relit</text>
  <text x="180" y="410" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#a78bfa" text-anchor="middle" font-weight="bold">constamment</text>
  <text x="180" y="430" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#a78bfa" text-anchor="middle" font-weight="bold">cette mémoire</text>
  <text x="180" y="460" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">pour savoir quoi faire</text>
  <text x="180" y="480" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">ensuite</text>
  
  <!-- OUTIL -->
  <rect x="780" y="280" width="220" height="140" rx="10" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="310" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#34d399" text-anchor="middle" font-weight="bold">🔧 OUTIL</text>
  <text x="890" y="335" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">Fonction :</text>
  <text x="890" y="355" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#34d399" text-anchor="middle" font-weight="bold">get_current_time</text>
  <text x="890" y="375" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">(ville: "Tokyo")</text>
  <text x="890" y="400" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#34d399" text-anchor="middle" font-weight="bold">→ 05:32</text>
  
  <!-- RÉPONSE -->
  <rect x="580" y="500" width="280" height="80" rx="10" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/>
  <text x="720" y="525" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#fbbf24" text-anchor="middle" font-weight="bold">RÉPONSE FINALE</text>
  <text x="720" y="550" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#fbbf24" text-anchor="middle">« À Tokyo il est 05h32 »</text>
  <text x="720" y="570" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">✓ Mission accomplie !</text>
</svg>