<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" role="img" aria-label="Comment fonctionne un agent IA">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#16233a" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#fbbf24"/>
    </marker>
    <marker id="arViolet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#a78bfa"/>
    </marker>
    <marker id="arCyan" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#22d3ee"/>
    </marker>
    <marker id="arEmerald" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1040" height="720" fill="#0B1120"/>
  <rect width="1040" height="720" fill="url(#grid)" opacity="0.55"/>

  <line x1="200" y1="180" x2="200" y2="356" stroke="#fbbf24" stroke-width="2" marker-end="url(#arAmber)"/>
  <line x1="330" y1="430" x2="428" y2="392" stroke="#a78bfa" stroke-width="2" marker-end="url(#arViolet)"/>
  <line x1="600" y1="472" x2="580" y2="576" stroke="#22d3ee" stroke-width="2" marker-end="url(#arCyan)"/>
  <path d="M 452 640 Q 140 700 205 505" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arEmerald)"/>
  <line x1="688" y1="380" x2="756" y2="148" stroke="#22d3ee" stroke-width="2" marker-end="url(#arCyan)"/>

  <text x="212" y="275" fill="#94a3b8" font-size="12">je pose la question</text>
  <text x="360" y="402" fill="#94a3b8" font-size="12" text-anchor="middle">il lit</text>
  <text x="612" y="540" fill="#94a3b8" font-size="12">il me manque une info</text>
  <text x="160" y="690" fill="#94a3b8" font-size="12" text-anchor="middle">je range le resultat</text>
  <text x="700" y="240" fill="#94a3b8" font-size="12">j'ai tout</text>

  <rect x="70" y="80" width="260" height="100" rx="12" fill="#0f172a"/>
  <rect x="70" y="80" width="260" height="100" rx="12" fill="rgba(120,53,15,0.35)" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="200" y="124" fill="#fde68a" font-size="17" font-weight="600" text-anchor="middle">Quelle heure est-il</text>
  <text x="200" y="148" fill="#fde68a" font-size="17" font-weight="600" text-anchor="middle">à Tokyo ?</text>

  <rect x="70" y="360" width="260" height="140" rx="12" fill="#0f172a"/>
  <rect x="70" y="360" width="260" height="140" rx="12" fill="rgba(76,29,149,0.45)" stroke="#a78bfa" stroke-width="1.5" filter="url(#shadow)"/>
  <ellipse cx="200" cy="360" rx="130" ry="10" fill="rgba(167,139,250,0.2)"/>
  <text x="200" y="420" fill="#ddd6fe" font-size="18" font-weight="600" text-anchor="middle">Memoire</text>
  <text x="200" y="450" fill="#a78bfa" font-size="13" text-anchor="middle">tout s'accumule ici</text>

  <polygon points="430,380 495,285 625,285 690,380 625,475 495,475" fill="#0f172a"/>
  <polygon points="430,380 495,285 625,285 690,380 625,475 495,475" fill="rgba(8,51,68,0.55)" stroke="#22d3ee" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="372" fill="#a5f3fc" font-size="20" font-weight="700" text-anchor="middle">Le cerveau</text>
  <text x="560" y="402" fill="#22d3ee" font-size="14" text-anchor="middle">il decide</text>

  <rect x="450" y="580" width="240" height="110" rx="12" fill="#0f172a"/>
  <rect x="450" y="580" width="240" height="110" rx="12" fill="rgba(6,78,59,0.55)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="570" y="618" fill="#a7f3d0" font-size="18" font-weight="600" text-anchor="middle">L'outil</text>
  <text x="570" y="646" fill="#6ee7b7" font-size="13" font-family="'JetBrains Mono',Consolas,monospace" text-anchor="middle">get_current_time</text>
  <text x="570" y="672" fill="#34d399" font-size="13" text-anchor="middle">repond : 05:32</text>

  <rect x="760" y="80" width="220" height="100" rx="12" fill="#0f172a"/>
  <rect x="760" y="80" width="220" height="100" rx="12" fill="rgba(120,53,15,0.35)" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="870" y="122" fill="#fde68a" font-size="16" font-weight="600" text-anchor="middle">Reponse</text>
  <text x="870" y="150" fill="#fde68a" font-size="16" font-weight="600" text-anchor="middle">05h32 a Tokyo</text>
</svg>
