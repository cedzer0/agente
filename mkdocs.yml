site_name: Agents, à poil
site_description: Ce que je comprends vraiment des agents IA — use cases, architecture, code, résultats.
site_url: https://cedzer0.github.io/agente/
repo_url: https://github.com/cedzer0/agente
edit_uri: edit/main/docs/

theme:
  name: material
  language: fr
  palette:
    scheme: slate
    primary: indigo
    accent: amber
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    logo: material/robot-outline

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cedzer0

copyright: "Agents, à poil — notes publiques sur les agents IA"
